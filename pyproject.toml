[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prose-lint"
version = "1.2.0"
description = "Deterministic Editorial Compiler, Deslop Quality Gate, and Multi-Channel Content Transpiler"
readme = "README.md"
authors = [
  { name = "xcalibur73" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    # PolyForm Noncommercial 1.0.0
    "License :: Free For Educational Use",
    "License :: Free For Non-commercial Use",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search"
]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0"
]

[project.scripts]
prose-lint = "prose_lint.cli:main"

[project.urls]
"Homepage" = "https://github.com/xcalibur73/prose-lint"
"Cloud Engine" = "https://webaudits.pro/tools/prose-lint"
"Bug Tracker" = "https://github.com/xcalibur73/prose-lint/issues"
